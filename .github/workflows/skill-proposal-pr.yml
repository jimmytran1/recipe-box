name: Open skill proposal PR
on:
  push:
    branches: ['skill-proposal-*']
permissions:
  pull-requests: write
  contents: read
jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --repo ${{ github.repository }} --base main --head ${{ github.ref_name }} --title "Skill proposal: ${{ github.ref_name }}" --body "Automated PR from the Hermes skill pipeline. Summary is in PROPOSAL.md at the top of the diff." || echo "PR already exists or nothing to do"
