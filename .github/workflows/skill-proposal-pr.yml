name: Open skill proposal PR
on:
  push:
    branches: ['skill-proposal-*']
permissions:
  pull-requests: write
  contents: read
jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --repo ${{ github.repository }} --base main --head ${{ github.ref_name }} --title "Skill proposal: ${{ github.ref_name }}" --body "$(git log -1 --pretty=%b)" || gh pr edit ${{ github.ref_name }} --body "$(git log -1 --pretty=%b)"
